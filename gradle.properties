# Gradle build configuration.
# Requires JDK 17+ (Gradle 9 baseline; jlink/jpackage come from that same JDK).
# Machine-specific settings such as org.gradle.java.home belong in
# %USERPROFILE%\.gradle\gradle.properties (or simply export JAVA_HOME) so this
# file stays portable for every clone and CI runner.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
